# COD-3440 spike — throwaway workflow, NOT for merging.
#
# Purpose: prove the musl recipe on real kernels of both architectures. The dev
# host is aarch64, and an x86_64 build cross-compiled there cannot load its BPF
# skeleton against an aarch64 kernel, so x86_64 can only be closed here.
#
# The aarch64 half of the recipe has since been reproduced locally on Ubuntu
# 24.04 aarch64 — same distro family as the runners, unlike the Arch host the
# original spike ran on, which is where the `-fno-link-libatomic` and
# `-mno-outline-atomics` workarounds came from. Neither is needed on Debian:
# `cargo build -p memtrack --target aarch64-unknown-linux-musl`, with
# CFLAGS_<target> as the only out-of-band variable, produces a fully static
# binary and the whole `--lib` suite passes. What this workflow adds on top is
# the x86_64 kernel, the integration shards, and the BPF load itself.
#
# To use it: push the spike branch, then
#
#   gh workflow run cod-3440-musl-check.yml --ref spike/cod-3440-memtrack-musl
#
# Manual trigger only, so it never fires on its own. Note that the very first
# dispatch of a workflow that lives only on a non-default branch 404s until
# GitHub has registered it; once it has appeared in the Actions list, --ref
# dispatch works. Delete the file once the question is answered -- it must not
# reach main.
#
# Deliberately does NOT touch release.yml, dist-workspace.toml or any
# Cargo.toml.
#
# --- what this workflow still carries, and why ---
#
# The three autoconf cache seeds and the aarch64 `-lgcc` link flag have moved to
# `.cargo/config.toml`: they are properties of the repo, portable, and correct
# for the gnu build too. What is left here is the one part that genuinely
# belongs to the build machine — the include flags:
#
#   -I<repo>/crates/memtrack/musl   the argp.h stub, an absolute path, and a
#                                   `[env]` table cannot build one (its
#                                   `relative = true` form yields a bare path,
#                                   with nowhere to put the -I).
#   -idirafter /usr/include/<triplet> -idirafter /usr/include
#                                   Debian's kernel UAPI headers. musl-gcc runs
#                                   with -nostdinc and only sees
#                                   /usr/include/<arch>-linux-musl, so libbpf's
#                                   <asm/unistd.h> and <asm/types.h> have to be
#                                   added back, last, behind musl's own headers.
#                                   These paths are Debian's layout; an Arch or
#                                   Alpine host needs different ones, so no
#                                   value checked into the repo could be right
#                                   for everyone.
#
# Both go into `CFLAGS_<target>` rather than `CFLAGS`. cc-rs reads
# CFLAGS_<target>, CFLAGS_<target_with_underscores>, TARGET_CFLAGS and CFLAGS,
# and accumulates them, so the target-scoped name reaches the musl build and is
# invisible to the gnu one. That is why the "compare against the gnu build" step
# below no longer has to `unset CFLAGS` first.
#
# It also replaces LIBBPF_SYS_EXTRA_CFLAGS, which this workflow used to set as
# well. libbpf-sys forwards `compiler.cflags_env()` to elfutils' ./configure,
# to zlib's, and to libbpf's make, appending LIBBPF_SYS_EXTRA_CFLAGS only to the
# last of those — so CFLAGS_<target> alone covers all three. If libbpf (not
# elfutils) is what fails to find <asm/unistd.h>, that assumption is what broke.

name: COD-3440 musl check

on:
  workflow_dispatch:

jobs:
  build:
    name: build ${{ matrix.arch }} ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, dist]
        # `arch` has to be a real dimension, not something the `include` entries
        # introduce on their own: an include entry whose keys are all new is
        # merged into *every* combination, so the second one would overwrite the
        # first and both jobs would end up aarch64. Listing it here makes each
        # entry match on `arch` and fill in only its own combinations.
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cflags_var: CFLAGS_x86_64_unknown_linux_musl
            triplet: x86_64-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cflags_var: CFLAGS_aarch64_unknown_linux_musl
            triplet: aarch64-linux-gnu
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: ./.github/actions/install-rust
        with:
          cache-key: musl-${{ matrix.arch }}-${{ matrix.profile }}
      - uses: ./.github/actions/install-bpf-deps

      - name: Install musl toolchain
        run: |
          sudo apt-get install -y musl-tools pkg-config linux-libc-dev
          rustup target add "$TARGET"

      # Exported once here so every later step sees the same value, and so the
      # `cargo build` below is a plain one with nothing prepended to it.
      - name: Point the musl build at the stub and the UAPI headers
        run: |
          VALUE="-I$GITHUB_WORKSPACE/crates/memtrack/musl -idirafter /usr/include/${{ matrix.triplet }} -idirafter /usr/include"
          # The target-scoped name is what cc-rs reads; MUSL_CFLAGS is a plain
          # mirror of it, so later steps can pass the value on without having to
          # index the env context by a matrix-computed key.
          echo "${{ matrix.cflags_var }}=$VALUE" >> "$GITHUB_ENV"
          echo "MUSL_CFLAGS=$VALUE" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build -p memtrack --profile ${{ matrix.profile }} --target "$TARGET"

      - name: Verify the artifact is genuinely static
        run: |
          BIN=target/$TARGET/${{ matrix.profile == 'dev' && 'debug' || matrix.profile }}/codspeed-memtrack
          file "$BIN"
          ldd "$BIN" || true            # expected: "not a dynamic executable"
          readelf -d "$BIN" || true     # expected: no dynamic section at all
          echo "size: $(stat -c %s "$BIN") bytes"
          # Fail loudly if anything reintroduced a dynamic dependency or an rpath.
          # `if` rather than `grep ... && exit 1`, because a grep that matches
          # nothing exits 1 and would fail the step under bash -e.
          if readelf -d "$BIN" 2>/dev/null | grep -qE 'NEEDED|RPATH|RUNPATH'; then
            echo "unexpected dynamic dependency or rpath"
            exit 1
          fi
          echo "OK: static, no NEEDED, no RPATH/RUNPATH"

      # No `unset CFLAGS` any more: the include flags are scoped to the musl
      # target, so a gnu build in the same shell cannot see them. If this step
      # fails on a missing or wrong argp.h, that scoping is what leaked.
      - name: Compare against the gnu build
        if: matrix.profile == 'dist'
        run: |
          cargo build -p memtrack --profile dist
          echo "musl: $(stat -c %s target/$TARGET/dist/codspeed-memtrack) bytes"
          echo "gnu:  $(stat -c %s target/dist/codspeed-memtrack) bytes"

      - name: Smoke test the BPF path
        run: |
          BIN=$PWD/target/$TARGET/${{ matrix.profile == 'dev' && 'debug' || matrix.profile }}/codspeed-memtrack
          mkdir -p /tmp/memtrack-out
          sudo env "RUST_LOG=info" "$BIN" track -o /tmp/memtrack-out "/bin/ls /tmp"
          ls -la /tmp/memtrack-out
          # A run that loads no probes still exits 0 but writes nothing.
          test -n "$(ls -A /tmp/memtrack-out)" || { echo "no artifact written"; exit 1; }

  tests:
    name: ${{ matrix.test }} (${{ matrix.arch }} musl)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Each memtrack integration test binary runs its cases serially (the eBPF
      # tracker can't overlap with itself in one process), so shard by binary.
      matrix:
        test: [c_tests, cpp_tests, rust_tests, spawn_tests, dlopen_tests, rss_tests]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cflags_var: CFLAGS_x86_64_unknown_linux_musl
            triplet: x86_64-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cflags_var: CFLAGS_aarch64_unknown_linux_musl
            triplet: aarch64-linux-gnu
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
          submodules: true
      - uses: ./.github/actions/install-rust
        with:
          cache-key: musl-${{ matrix.arch }}-${{ matrix.test }}
      - uses: ./.github/actions/install-bpf-deps

      - name: Install musl toolchain
        run: |
          sudo apt-get install -y musl-tools pkg-config linux-libc-dev
          rustup target add "$TARGET"

      - name: Install additional allocators
        run: sudo apt-get install -y libmimalloc-dev libjemalloc-dev

      - name: Point the musl build at the stub and the UAPI headers
        run: |
          VALUE="-I$GITHUB_WORKSPACE/crates/memtrack/musl -idirafter /usr/include/${{ matrix.triplet }} -idirafter /usr/include"
          # The target-scoped name is what cc-rs reads; MUSL_CFLAGS is a plain
          # mirror of it, so later steps can pass the value on without having to
          # index the env context by a matrix-computed key.
          echo "${{ matrix.cflags_var }}=$VALUE" >> "$GITHUB_ENV"
          echo "MUSL_CFLAGS=$VALUE" >> "$GITHUB_ENV"

      # Built separately from the run because test-with's env(GITHUB_ACTIONS)
      # gate is evaluated at COMPILE time. GITHUB_ACTIONS is set by the runner,
      # so this is automatic here -- but if the tests are ever built outside
      # Actions, the sudo-gated cases silently become #[ignore]d and the run
      # reports a green "0 passed; N ignored".
      - name: Build tests
        run: cargo test -p memtrack --target "$TARGET" --no-run

      - name: Run tests
        env:
          RUST_LOG: debug
        # Ubuntu 26.04 ships sudo-rs, which ignores `-E`; pass the env the
        # rustup shims and the test gate need through `env` instead. The
        # autoconf seeds no longer appear here -- they come from
        # .cargo/config.toml, which cargo reads regardless of who invokes it.
        run: |
          sudo env \
            "HOME=$HOME" \
            "PATH=$PATH" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "CARGO_INCREMENTAL=$CARGO_INCREMENTAL" \
            "RUST_LOG=$RUST_LOG" \
            "GITHUB_ACTIONS=$GITHUB_ACTIONS" \
            "${{ matrix.cflags_var }}=$MUSL_CFLAGS" \
            "TARGET=$TARGET" \
            $(which cargo) test --target "$TARGET" --test ${{ matrix.test }} \
              -- --test-threads 1 --nocapture
        working-directory: crates/memtrack

      # Since we ran the tests with sudo, the build artifacts will have root ownership
      - name: Clean up
        run: sudo chown -R $USER:$USER . ~/.cargo

  unit:
    name: unit tests (${{ matrix.arch }} musl)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cflags_var: CFLAGS_x86_64_unknown_linux_musl
            triplet: x86_64-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cflags_var: CFLAGS_aarch64_unknown_linux_musl
            triplet: aarch64-linux-gnu
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: ./.github/actions/install-rust
        with:
          cache-key: musl-${{ matrix.arch }}-unit
      - uses: ./.github/actions/install-bpf-deps

      - name: Install musl toolchain
        run: |
          sudo apt-get install -y musl-tools pkg-config linux-libc-dev
          rustup target add "$TARGET"

      - name: Point the musl build at the stub and the UAPI headers
        run: |
          VALUE="-I$GITHUB_WORKSPACE/crates/memtrack/musl -idirafter /usr/include/${{ matrix.triplet }} -idirafter /usr/include"
          # The target-scoped name is what cc-rs reads; MUSL_CFLAGS is a plain
          # mirror of it, so later steps can pass the value on without having to
          # index the env context by a matrix-computed key.
          echo "${{ matrix.cflags_var }}=$VALUE" >> "$GITHUB_ENV"
          echo "MUSL_CFLAGS=$VALUE" >> "$GITHUB_ENV"

      # `libc_allocator_symbols_resolve_to_offsets` used to be skipped here: it
      # read /proc/self/maps of the TEST BINARY and required a mapped libc.so.6,
      # which a statically linked musl binary does not have by construction. The
      # test now resolves symbols in a spawned child instead, matching what the
      # production path does, so the whole --lib suite must pass on musl.
      - name: Run unit tests
        run: cargo test -p memtrack --target "$TARGET" --lib
