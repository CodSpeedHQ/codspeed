# COD-3440 spike — throwaway workflow, NOT for merging.
#
# Purpose: prove the musl build on real kernels of both architectures. The dev
# host is aarch64, and an x86_64 build cross-compiled there cannot load its BPF
# skeleton against an aarch64 kernel, so x86_64 can only be closed here.
#
# To use it: push the spike branch, then
#
#   gh workflow run cod-3440-musl-check.yml --ref spike/cod-3440-memtrack-musl
#
# Manual trigger only, so it never fires on its own. Note that the very first
# dispatch of a workflow that lives only on a non-default branch 404s until
# GitHub has registered it; once it has appeared in the Actions list, --ref
# dispatch works. Delete the file once the question is answered -- it must not
# reach main.
#
# Deliberately does NOT touch release.yml or dist-workspace.toml.
#
# --- what this workflow no longer carries ---
#
# It used to export `CFLAGS_<target>` with the path to the `argp.h` stub and the
# `-idirafter` flags for Debian's kernel UAPI headers. The whole recipe now
# lives in `.cargo/config.toml`, so every `cargo` line below is a plain one:
# that is the point of running it, and a failure here means the checked-in
# config does not stand on its own.
#
# Two things make that possible, both of which cost a build to discover:
#
#   * `CPATH` rather than `CFLAGS -I<path>`. `[env]`'s `relative = true` can
#     only make a *bare* path absolute, and there is nowhere in such a value to
#     put an `-I`. `CPATH` takes bare directories, so it fits. It resolves
#     against the project root — the directory holding `.cargo/`, not `.cargo/`
#     itself, which the cargo reference words ambiguously.
#   * The stub is therefore on the include path for the gnu build too, and
#     defers to the real <argp.h> by testing `__GLIBC__`. Testing the include
#     path with `__has_include_next` looks equivalent and is not: the same
#     config puts `-idirafter /usr/include` on the *musl* build, which makes
#     glibc's argp.h reachable from a musl compilation, and the build then dies
#     on `__THROW`.
#
# The "compare against the gnu build" step below is what guards the second
# point: it builds gnu with the stub on CPATH, and only passes if the guard
# defers correctly.

name: COD-3440 musl check

on:
  workflow_dispatch:

jobs:
  build:
    name: build ${{ matrix.arch }} ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, dist]
        # `arch` has to be a real dimension, not something the `include` entries
        # introduce on their own: an include entry whose keys are all new is
        # merged into *every* combination, so the second one would overwrite the
        # first and both jobs would end up aarch64. Listing it here makes each
        # entry match on `arch` and fill in only its own combinations.
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: ./.github/actions/install-rust
        with:
          cache-key: musl-${{ matrix.arch }}-${{ matrix.profile }}
      - uses: ./.github/actions/install-bpf-deps

      - name: Install musl toolchain
        run: |
          sudo apt-get install -y musl-tools pkg-config linux-libc-dev
          rustup target add "$TARGET"

      # The root package is what ships now: it bundles memtrack and
      # exec-harness as hidden subcommands, so building `-p memtrack` alone
      # would no longer prove anything about the released artifact.
      - name: Build
        run: cargo build --bin codspeed --profile ${{ matrix.profile }} --target "$TARGET"

      - name: Verify the artifact is genuinely static
        run: |
          BIN=target/$TARGET/${{ matrix.profile == 'dev' && 'debug' || matrix.profile }}/codspeed
          file "$BIN"
          ldd "$BIN" || true            # expected: "not a dynamic executable"
          readelf -d "$BIN" || true     # expected: no dynamic section at all
          echo "size: $(stat -c %s "$BIN") bytes"
          # Fail loudly if anything reintroduced a dynamic dependency or an rpath.
          # `if` rather than `grep ... && exit 1`, because a grep that matches
          # nothing exits 1 and would fail the step under bash -e.
          if readelf -d "$BIN" 2>/dev/null | grep -qE 'NEEDED|RPATH|RUNPATH'; then
            echo "unexpected dynamic dependency or rpath"
            exit 1
          fi
          echo "OK: static, no NEEDED, no RPATH/RUNPATH"

      # The stub directory is on CPATH for this build too, so a gnu build that
      # still succeeds is the proof that the header's `__GLIBC__` guard defers
      # to the real <argp.h>. If this fails on `__THROW`, that guard is what
      # broke.
      - name: Compare against the gnu build
        if: matrix.profile == 'dist'
        run: |
          cargo build --bin codspeed --profile dist
          echo "musl: $(stat -c %s target/$TARGET/dist/codspeed) bytes"
          echo "gnu:  $(stat -c %s target/dist/codspeed) bytes"

      - name: Smoke test the BPF path
        run: |
          BIN=$PWD/target/$TARGET/${{ matrix.profile == 'dev' && 'debug' || matrix.profile }}/codspeed
          mkdir -p /tmp/memtrack-out
          # Through the bundled subcommand, which is how the runner reaches it.
          sudo env "RUST_LOG=info" "$BIN" memtrack track -o /tmp/memtrack-out "/bin/ls /tmp"
          ls -la /tmp/memtrack-out
          # A run that loads no probes still exits 0 but writes nothing.
          test -n "$(ls -A /tmp/memtrack-out)" || { echo "no artifact written"; exit 1; }

  tests:
    name: ${{ matrix.test }} (${{ matrix.arch }} musl)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Each memtrack integration test binary runs its cases serially (the eBPF
      # tracker can't overlap with itself in one process), so shard by binary.
      matrix:
        test: [c_tests, cpp_tests, rust_tests, spawn_tests, dlopen_tests, rss_tests]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
          submodules: true
      - uses: ./.github/actions/install-rust
        with:
          cache-key: musl-${{ matrix.arch }}-${{ matrix.test }}
      - uses: ./.github/actions/install-bpf-deps

      - name: Install musl toolchain
        run: |
          sudo apt-get install -y musl-tools pkg-config linux-libc-dev
          rustup target add "$TARGET"

      - name: Install additional allocators
        run: sudo apt-get install -y libmimalloc-dev libjemalloc-dev

      # Built separately from the run because test-with's env(GITHUB_ACTIONS)
      # gate is evaluated at COMPILE time. GITHUB_ACTIONS is set by the runner,
      # so this is automatic here -- but if the tests are ever built outside
      # Actions, the sudo-gated cases silently become #[ignore]d and the run
      # reports a green "0 passed; N ignored".
      - name: Build tests
        run: cargo test -p memtrack --target "$TARGET" --no-run

      - name: Run tests
        env:
          RUST_LOG: debug
        # Ubuntu 26.04 ships sudo-rs, which ignores `-E`; pass the env the
        # rustup shims and the test gate need through `env` instead. The
        # autoconf seeds no longer appear here -- they come from
        # .cargo/config.toml, which cargo reads regardless of who invokes it.
        run: |
          sudo env \
            "HOME=$HOME" \
            "PATH=$PATH" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "CARGO_INCREMENTAL=$CARGO_INCREMENTAL" \
            "RUST_LOG=$RUST_LOG" \
            "GITHUB_ACTIONS=$GITHUB_ACTIONS" \
            "TARGET=$TARGET" \
            $(which cargo) test --target "$TARGET" --test ${{ matrix.test }} \
              -- --test-threads 1 --nocapture
        working-directory: crates/memtrack

      # Since we ran the tests with sudo, the build artifacts will have root ownership
      - name: Clean up
        run: sudo chown -R $USER:$USER . ~/.cargo

  unit:
    name: unit tests (${{ matrix.arch }} musl)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: ./.github/actions/install-rust
        with:
          cache-key: musl-${{ matrix.arch }}-unit
      - uses: ./.github/actions/install-bpf-deps

      - name: Install musl toolchain
        run: |
          sudo apt-get install -y musl-tools pkg-config linux-libc-dev
          rustup target add "$TARGET"

      # `libc_allocator_symbols_resolve_to_offsets` used to be skipped here: it
      # read /proc/self/maps of the TEST BINARY and required a mapped libc.so.6,
      # which a statically linked musl binary does not have by construction. The
      # test now resolves symbols in a spawned child instead, matching what the
      # production path does, so the whole --lib suite must pass on musl.
      - name: Run unit tests
        run: cargo test -p memtrack --target "$TARGET" --lib
