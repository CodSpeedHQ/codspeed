[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# Whether to consider the binaries in a package for distribution (defaults true)
dist = true
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Builds every artifact on PRs and keeps them on the workflow run; only a tag push publishes
pr-run-mode = "upload"
# Post-announce jobs to run in CI
post-announce-jobs = ["./post-announce"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Build only the required packages, and individually
precise-builds = true
# Comment this out to rerun `dist generate`, then redo these hand edits to release.yml:
# - the `gh release create` call in `host` creates a draft, then a PATCH with only
#   `draft=false` publishes it so it is not marked as latest; post-announce marks runner
#   releases as latest (https://github.com/axodotdev/cargo-dist/issues/2244)
# - the `swatinem/rust-cache` step in `build-local-artifacts` is removed
allow-dirty = ["ci"]

# Dependabot bumps the pins in release.yml: copy them here before regenerating
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"          # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"   # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-latest"
aarch64-unknown-linux-musl = "ubuntu-26.04-arm"
