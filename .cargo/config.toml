# COD-3440 — what a musl build of `memtrack` needs, for the parts that are a
# property of the repo rather than of the machine doing the build.
#
# `libbpf-sys` vendors elfutils, whose `configure` unconditionally looks for
# `argp`, `obstack` and `fts`. musl ships none of them, so the checks fail and
# the build stops before it ever gets to libelf. A libelf-only build never calls
# into any of them, though — the checks are there for the elfutils CLI tools,
# which we do not build.
#
# Pre-seeding autoconf's cache makes `configure` skip those three checks
# entirely. "none required" means "the symbol is available with no extra -l
# flag", which is the answer a glibc host would have reached on its own, so
# these are set unconditionally rather than per-target: they are correct for the
# gnu build too, where they only save three `configure` probes.
#
# This is deliberately the whole of what lives here. The remaining piece of the
# recipe — the include flags that point at the `argp.h` stub in
# `crates/memtrack/musl/` and at the kernel UAPI headers — cannot live in a
# `[env]` table, and should not: see `.github/workflows/cod-3440-musl-check.yml`
# for where it goes and why.
[env]
ac_cv_search_argp_parse = "none required"
ac_cv_search__obstack_free = "none required"
ac_cv_search_fts_close = "none required"

# rustc links with `-nodefaultlibs`, so gcc does not pull in libgcc. On aarch64,
# libbpf's C code needs the outline-atomic helpers (`__aarch64_ldadd4_sync` and
# friends) that live there, and the link fails without it. x86_64 has no such
# helpers and needs nothing.
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-lgcc"]
